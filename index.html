<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시누의 잡동사니 도구들</title>
    <meta property="og:title" content="시누의 잡동사니 도구들" />
    <meta property="og:description" content="필요할 때마다 만든 시답잖은 웹앱 컬렉션" />
    <link rel="manifest" href="./sinutools.webmanifest">
    <link rel="apple-touch-icon-precomposed" href="favicon.png">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="r2.css">
    <style>
        @media (orientation: portrait) {
            :root {
                --body-pad: 12px;
                --launcher-hpad: 0px;
                --icon-vpad: 2.5vh;
                --icon-size: 14vw;
                --icon-border-radius: 12px;
                --column-count: 4;
            }
        }
        @media (orientation: landscape) {
            :root {
                --body-pad: 24px;
                --launcher-hpad: 8vw;
                --icon-vpad: 2vh;
                --icon-size: 14vh;
                --icon-border-radius: 12px;
                --column-count: 6;
            }
        }
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            padding: var(--body-pad);
            display: flex;
            flex-direction: column;
            text-align: center;
            box-sizing: border-box;
        }
        .index-home {
            flex-grow: 1;
            padding: 16px var(--launcher-hpad);
        }
        .index-launcher {
            display: grid;
            grid-template-columns: repeat(var(--column-count), 1fr);
        }
        .index-launcher-item {
            text-align: center;
            padding: var(--icon-vpad) 0;
        }
        .index-launcher-title {
            padding-top: 1.5vh;
            font-size: 16px;
            text-wrap: nowrap;
        }
        .item-icon {
            background-color: rgb(55, 55, 55);
            border-radius: var(--icon-border-radius);
            width: var(--icon-size);
            height: var(--icon-size);
        }
        a {
            text-decoration: none;
            color: var(--sinutools-fgcolor);
            -webkit-tap-highlight-color: transparent;
        }
        .launch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--sinutools-bgcolor);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .launch-overlay.active {
            opacity: 1;
        }
        .launching {
            position: fixed;
            z-index: 1000;
            animation: launch 0.4s cubic-bezier(.36,.97,.26,1) forwards;
            object-fit: none;
        }
        @keyframes launch {
            0% {
                position: fixed;
                background-color: rgb(55, 55, 55);
                border-radius: var(--icon-border-radius);
            }
            50% {
                background-color: rgb(55, 55, 55);
            }
            100% {
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                width: 100%;
                height: 100%;
                background-color: var(--sinutools-bgcolor);
                border-radius: 0px;
            }
        }
    </style>
</head>
<body onpagehide="resetZoom()">
    <div id="launch-overlay" class="launch-overlay"></div>
    <div class="index-home">
        <div class="index-launcher">
            <div class="index-launcher-item"><a href="bigclock.html"><img class="item-icon" src="icons/bigclock.png"><br/><div class="index-launcher-title">큰시계</div></a></div>
            <div class="index-launcher-item"><a href="yesno.html"><img class="item-icon" src="icons/yesno.png"><br/><div class="index-launcher-title">예니오</div></a></div>
            <div class="index-launcher-item"><a href="spinarrow.html"><img class="item-icon" src="icons/spinarrow.png"><br/><div class="index-launcher-title">빙글빙글</div></a></div>
            <div class="index-launcher-item"><a href="onepick.html"><img class="item-icon" src="icons/onepick.png"><br/><div class="index-launcher-title">원픽</div></a></div>
            <div class="index-launcher-item"><a href="dice.html"><img class="item-icon" src="icons/dice.png"><br/><div class="index-launcher-title">주사위</div></a></div>
            <div class="index-launcher-item"><a href="rng.html"><img class="item-icon" src="icons/rng.png"><br/><div class="index-launcher-title">랜덤숫자</div></a></div>
            <div class="index-launcher-item"><a href="drawlots.html"><img class="item-icon" src="icons/drawlots.png"><br/><div class="index-launcher-title">제비뽑기</div></a></div>
            <div class="index-launcher-item"><a href="bigtexts.html"><img class="item-icon" src="icons/bigtexts.png"><br/><div class="index-launcher-title">멈춘큰글</div></a></div>
            <div class="index-launcher-item"><a href="bigtext.html"><img class="item-icon" src="icons/bigtext.png"><br/><div class="index-launcher-title">흐르는큰글</div></a></div>
            <div class="index-launcher-item"><a href="blackout.html"><img class="item-icon" src="icons/blackout.png"><br/><div class="index-launcher-title">어둠에다크</div></a></div>
            <div class="index-launcher-item"><a href="about.html"><img class="item-icon" src="icons/about.png"><br/><div class="index-launcher-title">이게뭐에요</div></a></div>
        </div>
    </div>
    <div class="index-info">
        <div class="index-title">시누의 잡동사니 도구들</div>
        <div class="index-copyright">© 2022‑2025 sinu. All rights reserved.</div>
    </div>
    <script>
        var navEvent = -1;

        document.querySelectorAll('.index-launcher-item a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                const icon = this.querySelector('img');
                const href = this.href;
                const rect = icon.getBoundingClientRect();
                const overlay = document.querySelector('.launch-overlay');
                
                // Create clone for animation
                const clone = icon.cloneNode(true);
                clone.style.top = rect.top + 'px';
                clone.style.left = rect.left + 'px';
                clone.style.width = rect.width + 'px';
                clone.style.height = rect.height + 'px';
                clone.classList.add('launching');
                
                document.body.appendChild(clone);
                overlay.classList.add('active');

                history.pushState({}, "");
                
                // Navigate after animation
                navEvent = setTimeout(() => {
                    window.location.href = href;
                }, 300);
            });
        });

        function resetZoom() {
            var zooms = document.getElementsByClassName('launching');
            for (var i = 0; i < zooms.length; i++) zooms[i].remove();
            document.getElementById('launch-overlay').classList.remove('active');
        }

        window.addEventListener("popstate", function(event) {
            clearTimeout(navEvent);
            resetZoom();
        });

    </script>
</body>
</html>
