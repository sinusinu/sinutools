<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시누의 잡동사니 도구들</title>
    <meta property="og:title" content="시누의 잡동사니 도구들" />
    <meta property="og:description" content="필요할 때마다 만든 시답잖은 웹앱 컬렉션" />
    <link rel="apple-touch-icon-precomposed" href="favicon.png">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="r2.css">
    <style>
        @media (orientation: portrait) {
            :root {
                --body-pad: 12px;
                --launcher-hpad: 0px;
                --icon-vpad: 2.5vh;
                --icon-size: 14vw;
                --icon-border-radius: 12px;
                --column-count: 4;
            }
        }
        @media (orientation: landscape) {
            :root {
                --body-pad: 24px;
                --launcher-hpad: 8vw;
                --icon-vpad: 2vh;
                --icon-size: 14vh;
                --icon-border-radius: 12px;
                --column-count: 6;
            }
        }
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            padding: var(--body-pad);
            display: flex;
            flex-direction: column;
            text-align: center;
            box-sizing: border-box;
        }
        .index-home {
            flex-grow: 1;
            padding: 16px var(--launcher-hpad);
        }
        .index-launcher {
            display: grid;
            grid-template-columns: repeat(var(--column-count), 1fr);
        }
        .index-launcher-item {
            text-align: center;
            padding: var(--icon-vpad) 0;
        }
        .index-launcher-title {
            padding-top: 1.5vh;
            font-size: 16px;
            text-wrap: nowrap;
        }
        .item-icon {
            background-color: rgb(55, 55, 55);
            border-radius: var(--icon-border-radius);
            width: var(--icon-size);
            height: var(--icon-size);
        }
        a {
            text-decoration: none;
            color: var(--sinutools-fgcolor);
        }
    </style>
</head>
<body>
    <div class="index-home">
        <div class="index-launcher">
            <div class="index-launcher-item"><a href="bigclock.html"><img class="item-icon" src="icons/bigclock.png"><br/><div class="index-launcher-title">큰시계</div></a></div>
            <div class="index-launcher-item"><a href="yesno.html"><img class="item-icon" src="icons/yesno.png"><br/><div class="index-launcher-title">예니오</div></a></div>
            <div class="index-launcher-item"><a href="spinarrow.html"><img class="item-icon" src="icons/spinarrow.png"><br/><div class="index-launcher-title">빙글빙글</div></a></div>
            <div class="index-launcher-item"><a href="onepick.html"><img class="item-icon" src="icons/onepick.png"><br/><div class="index-launcher-title">원픽</div></a></div>
            <div class="index-launcher-item"><a href="dice.html"><img class="item-icon" src="icons/dice.png"><br/><div class="index-launcher-title">주사위</div></a></div>
            <div class="index-launcher-item"><a href="rng.html"><img class="item-icon" src="icons/rng.png"><br/><div class="index-launcher-title">랜덤숫자</div></a></div>
            <div class="index-launcher-item"><a href="drawlots.html"><img class="item-icon" src="icons/drawlots.png"><br/><div class="index-launcher-title">제비뽑기</div></a></div>
            <div class="index-launcher-item"><a href="bigtexts.html"><img class="item-icon" src="icons/bigtexts.png"><br/><div class="index-launcher-title">멈춘큰글</div></a></div>
            <div class="index-launcher-item"><a href="bigtext.html"><img class="item-icon" src="icons/bigtext.png"><br/><div class="index-launcher-title">흐르는큰글</div></a></div>
            <div class="index-launcher-item"><a href="blackout.html"><img class="item-icon" src="icons/blackout.png"><br/><div class="index-launcher-title">어둠에다크</div></a></div>
        </div>
    </div>
    <div class="index-info">
        <a href="about.html">
            <div class="index-title">시누의 잡동사니 도구들 R2</div>
            <div class="index-copyright">© 2022‑2024, 2025 sinu. All rights reserved.</div>
        </a>
    </div>
</body>
</html>
